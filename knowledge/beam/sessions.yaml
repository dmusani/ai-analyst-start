table: sessions
source: course-db public.sessions
table_comment: Records user activity sessions.
description: >-
  One row per user activity session, labelled with its main activity (browse, listen or read).
  The only usage data Beam has. Use it for activity, engagement and anything behavioural. It is
  a large table: query it with aggregates only.
grain:
  statement: one row per session_id; one user activity session, labelled with its main activity.
  confidence: confirmed
primary_key: session_id
default_filters:
  - rule: "Cap at session_date <= '2026-09-24'. 273 rows are dated 2026-09-25 or 2026-09-26."
    quirk: sessions_after_data_end
  - rule: "Always filter session_date first and keep the window as narrow as the question allows."
    quirk: null

query_guidance:
  size: >-
    This table is huge (4.3 million rows here, and possibly a sample of a far larger
    source). Treat it as too big to read row by row.
  rule: >-
    Query it only with aggregates (counts, distinct counts, sums, averages, percentiles,
    min and max), grouped by something coarse such as month, day, activity_type or plan.
    Never select raw rows or `select *`, and never print session-level rows into the
    conversation.
  practice:
    - Filter by `session_date` first and keep the window as narrow as the question allows.
    - Aggregate in the database and pull back only the small result table, not the rows.
    - Avoid group-bys on `user_id` or on several columns at once without a date filter; there is no index beyond the primary key, and a wide group-by has already run the server out of temp disk space.
    - For daily, weekly or monthly active users, prefer `marts.user_activity_metrics` over recounting from `sessions`. Reconciled on 2026-11-23: the mart matches `sessions` exactly (see golden query `mart_reconciliation`).
    - Join to `users` or `subscriptions` only after aggregating sessions to the level of the join, not before.

relationships:
  - to: users
    on: sessions.user_id = users.user_id
    cardinality: many-to-one
    note: every session has a user (0 missing). About 5% of users have no session. Aggregate sessions per user before joining.
    status: confirmed
  - to: trials
    on: sessions.user_id = trials.user_id
    cardinality: many-to-one (one trial per user)
    note: window sessions to the trial dates and aggregate per trial first.
  - to: subscriptions
    on: via users.user_id = subscriptions.user_id
    cardinality: many-to-one
    note: there is no direct key. Go sessions to users to subscriptions, after aggregating.
  - to: marts.user_activity_metrics
    on: derived (DAU, WAU, MAU by date)
    cardinality: derived table
    note: >-
      mart DAU is distinct users with a session on the date. WAU is the trailing 7 days ending on
      the date. MAU is the trailing 30 days ending on the date.

sample:
  database_rows: 4335470
  source_rows: 368000000
  source_rows_status: stated by the user earlier, not measured here
  note: >-
    The database table equals the earlier CSV export (4,335,470 rows). Whether it is itself a
    sample of a larger real table (about 1.2% of 368 million) and how it was drawn is unknown.
    Do not read totals as Beam-wide figures; rates and mixes are the safer reads.
source_ddl_notes:
  - Primary key `session_id` (serial, integer).
  - All columns are NOT NULL in the source, which agrees with the 0% null rates.
  - "`session_date` is `timestamp without time zone`, `duration_minutes` is `integer`, `activity_type` is `varchar(255)`."
  - Only the primary key index exists; there is no index on `user_id` or `session_date`, so large group-bys on this table are slow and can run the database out of temp space.

columns:
  - name: session_id
    role: key
    description: unique session identifier (0 duplicates).
    confidence: confirmed
  - name: user_id
    role: key
    description: the user. Not unique per row.
    confidence: confirmed
  - name: session_date
    role: time
    description: >-
      day of the session. The metadata says date and time, but every value is at midnight, so it is
      a date only. Time of day is not available.
    quirk_refs: [timestamps_everywhere, sessions_after_data_end]
    confidence: confirmed
  - name: duration_minutes
    role: measure
    description: length of the session in minutes. Minimum 1. Right-skewed.
    confidence: confirmed
  - name: activity_type
    role: dimension
    description: the main activity of the session. One value per session.
    allowed_values:
      browse: about 60% of sessions.
      listen: about 30%.
      read: about 10%, the smallest share.
    confidence: confirmed

definitions:
  session: One row. A session mixing activities is labelled by its main one. Date only, no time.
  active_user: A distinct user with at least one session in the window.
  DAU: Distinct active users on one day.
  WAU: Distinct active users in the 7 days ending on a date.
  MAU: Distinct active users in the 30 days ending on a date. It is a trailing 30 days, not a calendar month.
  sessions_per_active_user: Sessions divided by distinct users in the same window. Compare as a rate only.
  engagement_depth: Average and median `duration_minutes`. Mean 10.5, median 7, so use the median for a typical session.

measures:
  - name: sessions_count
    description: number of sessions.
    sql: count(*)
    filters: ["session_date <= '2026-09-24'"]
    caveats: [Counts may be a sample of a larger table. Compare periods, do not quote as Beam totals.]
    quirk_refs: [sessions_after_data_end]
  - name: active_users
    description: distinct users with a session in the window (DAU, WAU or MAU by window length).
    sql: count(distinct user_id)
    filters: [a narrow session_date window]
    caveats: [Prefer marts.user_activity_metrics for DAU, WAU and MAU.]
  - name: sessions_per_active_user
    description: sessions divided by active users in the same window.
    sql: count(*)::numeric / count(distinct user_id)
    caveats: [Valid only if the sampling method is known. Treat as indicative.]
  - name: avg_session_minutes
    description: average session length. Use the median as well.
    sql: avg(duration_minutes)
  - name: activity_mix
    description: share of sessions by activity type.
    sql: count(*)::numeric / sum(count(*)) over ()
    grain: activity_type

golden_queries:
  - name: monthly_sessions
    question: How do sessions and average length move by month?
    measures: [sessions_count, avg_session_minutes]
    sql: |
      select to_char(date_trunc('month', session_date), 'YYYY-MM') as ym,
             count(*) as sessions,
             round(avg(duration_minutes), 2) as avg_minutes
      from public.sessions
      where session_date >= '2026-01-01' and session_date <= '2026-09-24'
      group by 1
      order by 1;
    expected: >-
      2026-01 151,204; 02 139,957; 03 158,183; 04 154,634; 05 160,370; 06 156,487; 07 164,534;
      08 201,247; 09 159,859 (24 days). Average length stays 10.4 to 10.5 minutes.
    verified: 2026-11-23
  - name: activity_mix_month
    question: What is the mix of activity types in a month?
    measures: [activity_mix]
    sql: |
      select activity_type, count(*) as sessions,
             round(count(*)::numeric / sum(count(*)) over (), 4) as share
      from public.sessions
      where session_date >= '2026-08-01' and session_date <= '2026-08-31'
      group by 1
      order by 2 desc;
    expected: "August 2026: browse 118,526 (0.5890), listen 62,990 (0.3130), read 19,731 (0.0980)."
    verified: 2026-11-23
  - name: mau_and_depth_month
    question: How many users were active in a month, and how deep is their use?
    measures: [active_users, sessions_per_active_user]
    sql: |
      select count(distinct user_id) as active_users,
             count(*) as sessions,
             round(count(*)::numeric / count(distinct user_id), 2) as sessions_per_active_user,
             percentile_cont(0.5) within group (order by duration_minutes) as median_minutes,
             percentile_cont(0.9) within group (order by duration_minutes) as p90_minutes
      from public.sessions
      where session_date >= '2026-08-01' and session_date <= '2026-08-31';
    expected: "August 2026: 25,088 active users, 201,247 sessions, 8.02 sessions per active user, median 7, p90 23 minutes."
    verified: 2026-11-23
  - name: mart_reconciliation
    question: Does the mart agree with the sessions table?
    measures: [active_users]
    sql: |
      select
        (select dau from marts.user_activity_metrics where date = '2026-08-15') as mart_dau,
        (select count(distinct user_id) from public.sessions where session_date = '2026-08-15') as sessions_dau,
        (select wau from marts.user_activity_metrics where date = '2026-08-15') as mart_wau,
        (select count(distinct user_id) from public.sessions where session_date between '2026-08-09' and '2026-08-15') as sessions_wau,
        (select mau from marts.user_activity_metrics where date = '2026-08-31') as mart_mau,
        (select count(distinct user_id) from public.sessions where session_date between '2026-08-02' and '2026-08-31') as sessions_mau;
    expected: "DAU 5,054 both; WAU 17,867 both; MAU 25,037 both. The mart equals sessions with trailing 7 and 30 day windows."
    verified: 2026-11-23

facts:
  - >-
    Every month from 2022-01 to 2026-09 has rows (57 months, no gaps). 2022-01 has 18 distinct
    days (data starts 2022-01-12) and 2026-09 has 26; every other month covers all of its days.
  - >-
    Monthly volume climbs from 93 sessions in 2022-01 to about 144,000 in 2025-08, then runs flat
    at about 140,000 to 165,000 a month through 2026-07.
  - >-
    2026-08 is high: 201,247 sessions against 164,534 in 2026-07 (about 6,500 a day against
    5,300). Hypothesis, not confirmed: it follows the 2026-08 signup surge, since 1,180 of the
    2,315 signups in 2026-08 are trial users (see users.yaml).
  - No September 2025 spike in sessions (142,421 against 144,602 in 2025-08), though signups spike.
  - "273 rows are dated 2026-09-25 (189) or 2026-09-26 (84). Exclude them."
  - "duration_minutes: min 1, median 7, mean 10.5, p90 23, p99 47, max 157. Right-skewed. 11,877 sessions are 60 minutes or more."
  - "29,568 of the 31,165 users have at least one session. About 5% have none."
  - >-
    21,479 rows repeat the same user, date, duration and activity as another row but have a
    different session_id. From the earlier export, not re-run on the database (it ran the server
    out of temp space). They may be genuine separate short sessions; they are not removed.
open_questions:
  - Is this table a sample of a larger real table, and how was it drawn? This decides whether per-user counts are valid.
  - Why do 273 rows fall after 2026-09-24?
  - Are very short sessions (1 to 2 minutes) real or incidental? Do not filter on duration until someone decides.

profile:
  profiled_at: 2026-11-23
  rows: 4335470
  columns:
    session_id: {null_rate: 0.0, distinct: 4335470}
    user_id: {null_rate: 0.0, distinct: 29568}
    session_date: {null_rate: 0.0, distinct: 1717}
    duration_minutes: {null_rate: 0.0, distinct: 132}
    activity_type: {null_rate: 0.0, distinct: 3}
  date_ranges:
    session_date: ["2022-01-12T00:00:00", "2026-09-26T00:00:00"]
  low_cardinality:
    activity_type: {browse: 2597635, listen: 1306227, read: 431608}

caveats:
  - Safe for rates, mixes and distributions. Check the sampling method before using counts or per-user figures.
  - 273 rows are after the analysis date. Cap every count at 2026-09-24.
