table: trials
rows: 2073
grain:
  statement: one row per trial_id
  status: guess
primary_key: trial_id
columns:
  - name: trial_id
    dtype: int64
    null_rate: 0.0
    distinct: 2073
    meaning: >-
      unique, and so is `user_id`, so each user has at most one trial (profile output;
      matches AGENTS.md).
    meaning_status: inferred
  - name: user_id
    dtype: int64
    null_rate: 0.0
    distinct: 2073
    meaning: >-
      unique, so each user has at most one trial. All `user_id`s are found in `users`
      (checked).
    meaning_status: inferred
  - name: started_at
    dtype: datetime64[ns]
    null_rate: 0.0
    distinct: 2071
    meaning: >-
      when the trial began. Runs 2026-08-01 to 2026-09-24, so the table holds about seven
      weeks of trials (quirk: trials launched 2026-08-01). No earlier history exists.
    meaning_status: inferred
  - name: ends_at
    dtype: datetime64[ns]
    null_rate: 0.0
    distinct: 2071
    meaning: >-
      `started_at` plus 14 days. Runs to 2026-10-08, after the analysis date.
    meaning_status: inferred
  - name: outcome
    dtype: object
    null_rate: 0.2016
    distinct: 2
    meaning: >-
      converted or canceled (converted = became paid, confirmed against `subscriptions`;
      see facts). 20.16% null = trials still open (418 rows). Every open trial has
      `ends_at` after 2026-09-24 and started on or after 2026-09-11 (checked), so the
      nulls are explained by the quirk "trials mature late". Exclude them from
      conversion rates.
    meaning_status: confirmed
  - name: outcome_at
    dtype: datetime64[ns]
    null_rate: 0.2016
    distinct: 1655
    meaning: >-
      when the outcome was recorded. Null exactly when `outcome` is null (checked),
      never before `started_at`, never after `ends_at` (checked). Some trials resolve
      before `ends_at` (early cancel or early conversion; inferred).
    meaning_status: inferred
date_ranges:
  - column: started_at
    min: "2026-08-01T00:29:17"
    max: "2026-09-24T22:59:05"
  - column: ends_at
    min: "2026-08-15T00:29:17"
    max: "2026-10-08T22:59:05"
  - column: outcome_at
    min: "2026-08-06T05:37:23"
    max: "2026-09-24T23:55:08"
low_cardinality:
  outcome:
    converted: 828
    canceled: 827
facts:
  - >-
    Converted means paid (confirmed, checked on the data to 2026-09-24): all 828
    converted trials have a paid subscription (590 monthly, 238 annual) that starts on
    the trial's `ends_at` date (median gap 0 days, 100% within one day). None of the 827
    canceled trials and none of the 418 open trials has a paid subscription. Matching is
    by `user_id`, which is unique in `subscriptions`.
  - >-
    Because early outcomes arrive before `ends_at`, trials started in the last 14 days
    are partly resolved and the resolved part may not be representative (early resolvers
    differ from late ones). Treat rates for those cohorts as provisional.
open_questions: []
verdict:
  status: Proceed
  reasons:
    - The grain is clear and every null is explained by a quirk.
    - Caution for any trend: the latest two weeks of cohorts are unmatured.
